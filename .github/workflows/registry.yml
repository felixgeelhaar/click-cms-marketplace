name: Marketplace Registry

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "manifests/*.json"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "manifests/*.json"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifests and package identity
        run: |
          python3 scripts/test_validate_packages.py
          python3 scripts/validate-packages.py

  publish:
    name: Sign and publish registry
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate manifests and package identity
        run: |
          python3 scripts/test_validate_packages.py
          python3 scripts/validate-packages.py

      - name: Write private key
        run: |
          set -euo pipefail
          if [ -z "${MARKETPLACE_PRIVATE_KEY}" ]; then
            echo "MARKETPLACE_PRIVATE_KEY is missing" >&2
            exit 1
          fi
          echo "${MARKETPLACE_PRIVATE_KEY}" > private.pem
        env:
          MARKETPLACE_PRIVATE_KEY: ${{ secrets.MARKETPLACE_PRIVATE_KEY }}

      - name: Build registry
        run: |
          set -euo pipefail
          php scripts/build-registry-from-manifests.php manifests private.pem registry.json

      - name: Commit registry
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No registry changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "Update registry"
          git push
